<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<style>
  html, body { margin:0; height:100%; background:#02060f; overflow:hidden;
               font-family:"Cascadia Code","Consolas",monospace; color:#9fd8ff; }
  canvas { display:block; }
  #cabecera { position:fixed; top:18px; left:0; right:0; text-align:center; pointer-events:none; }
  #titulo { font-size:26px; letter-spacing:14px; color:#bfe9ff; text-shadow:0 0 18px #2aa4ff; }
  #lema { margin-top:3px; font-size:9px; letter-spacing:5px; color:#3f7fb8; }
  #estado { margin-top:8px; font-size:14px; letter-spacing:7px; color:#5fb6ff; opacity:.95;
            text-shadow:0 0 12px rgba(42,164,255,.5); }
  #pie { position:fixed; bottom:22px; left:0; right:0; text-align:center; pointer-events:none; }
  #frase { font-size:14px; line-height:1.5; color:#cfeeff;
           text-shadow:0 0 10px rgba(42,164,255,.6);
           max-width:84%; margin:0 auto 8px; min-height:18px; }
  #meta { font-size:11px; letter-spacing:3px; color:#3f7fb8; }
  .fuera { opacity:.25; transition:opacity .6s; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="cabecera">
  <div id="titulo">J.A.R.V.I.S.</div>
  <div id="lema">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
  <div id="estado">SISTEMAS EN LÍNEA</div>
</div>
<div id="pie">
  <div id="frase"></div>
  <div id="meta"></div>
</div>
<script>
"use strict";
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
let W = 0, H = 0;
function redimensionar(){ W = lienzo.width = innerWidth; H = lienzo.height = innerHeight; }
addEventListener("resize", redimensionar); redimensionar();

/* ---- estados: color, velocidad de giro, fuerza del pulso ---- */
const ESTADOS = {
  IDLE:   { rgb:[ 58,160,255], vel:0.9,  pulso:0.25, rotulo:"SISTEMAS EN LÍNEA" },
  WAKE:   { rgb:[255,255,255], vel:3.0,  pulso:1.0,  rotulo:"A SUS ÓRDENES" },
  LISTEN: { rgb:[ 57,230,160], vel:1.3,  pulso:0.7,  rotulo:"LO ESCUCHO, SEÑOR" },
  THINK:  { rgb:[255,179, 71], vel:2.6,  pulso:0.55, rotulo:"PROCESANDO···" },
  SPEAK:  { rgb:[ 77,227,255], vel:1.6,  pulso:0.95, rotulo:"TRANSMITIENDO" },
};
let estadoActual = "IDLE";
let color = ESTADOS.IDLE.rgb.slice();          // color animado (lerp hacia el objetivo)
let velocidad = ESTADOS.IDLE.vel, pulso = ESTADOS.IDLE.pulso;

/* ---- nodos: esfera de Fibonacci con los ARCHIVOS reales de la memoria ---- */
let nodos = [];      // {x,y,z, nombre}
let aristas = [];    // [i,j] vecinos más cercanos
function construir(nombres){
  const N = Math.max(nombres.length, 90);
  nodos = [];
  const dorado = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++){
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y), th = dorado * i;
    nodos.push({ x: Math.cos(th)*r, y, z: Math.sin(th)*r, nombre: nombres[i] || "" });
  }
  aristas = [];
  for (let i = 0; i < N; i++){                 // 2 vecinos más cercanos por nodo
    const d = nodos.map((n, j) => [j, (n.x-nodos[i].x)**2 + (n.y-nodos[i].y)**2 + (n.z-nodos[i].z)**2]);
    d.sort((a,b) => a[1]-b[1]);
    aristas.push([i, d[1][0]], [i, d[2][0]]);
  }
}
construir([]);
fetch("/nodos").then(r => r.json()).then(construir).catch(()=>{});

/* ---- estado en vivo ---- */
const elEstado = document.getElementById("estado");
const elFrase = document.getElementById("frase");
const elMeta = document.getElementById("meta");
let activaciones = 0, sinSenal = 0, desconectado = false;
async function sondear(){
  try {
    const e = await (await fetch("/estado")).json();
    estadoActual = ESTADOS[e.estado] ? e.estado : "IDLE";
    activaciones = e.activaciones || 0;
    elFrase.textContent = e.texto ? (e.quien === "usted" ? "USTED  ›  " : "JARVIS  ›  ") + e.texto : "";
    sinSenal = 0; desconectado = false; document.body.classList.remove("fuera");
  } catch {
    if (++sinSenal > 4){  // Jarvis apagado: que la pestaña huérfana LO DIGA, no "en reposo"
      desconectado = true;
      document.body.classList.add("fuera");
      elEstado.textContent = "SIN CONEXIÓN — JARVIS APAGADO";
    }
  }
}
setInterval(sondear, 400); sondear();

/* ---- ondas al hablar / chispas al pensar ---- */
let ondas = [];      // radios crecientes en SPEAK
let chispas = [];    // partículas hacia el núcleo en THINK

/* ---- bucle de dibujo ---- */
let t = 0, previo = performance.now();
function marco(ahora){
  if (W !== innerWidth || H !== innerHeight) redimensionar();  // pane recién visible / cambio de monitor
  const dt = Math.min(0.05, (ahora - previo) / 1000); previo = ahora;
  const cfg = ESTADOS[estadoActual];
  for (let k = 0; k < 3; k++) color[k] += (cfg.rgb[k] - color[k]) * Math.min(1, dt * 4);
  velocidad += (cfg.vel - velocidad) * Math.min(1, dt * 3);
  pulso += (cfg.pulso - pulso) * Math.min(1, dt * 3);
  if (!desconectado) elEstado.textContent = cfg.rotulo;
  t += dt * velocidad;

  ctx.fillStyle = "rgba(2,6,15,0.34)";           // estela suave
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 + 14;
  const R = Math.min(W, H) * 0.33;
  const [cr, cg, cb] = color.map(Math.round);
  const lat = (min, alfa) => `rgba(${cr},${cg},${cb},${alfa})`;
  const respira = 1 + Math.sin(t * 2.1) * 0.02 * (1 + pulso);

  /* anillos HUD decorativos */
  ctx.lineWidth = 1;
  for (const [rr, a0, va] of [[1.22, 0.4, 0.15], [1.34, 2.2, -0.09]]){
    ctx.strokeStyle = lat(0, 0.16);
    ctx.beginPath();
    ctx.arc(cx, cy, R * rr, a0 + t * va, a0 + t * va + Math.PI * 1.25);
    ctx.stroke();
  }

  /* núcleo (arc reactor) */
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.42);
  const late = 0.35 + 0.25 * pulso * (0.6 + 0.4 * Math.sin(t * 6));
  halo.addColorStop(0, `rgba(${cr},${cg},${cb},${late})`);
  halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.42, 0, 7); ctx.fill();

  /* rotación + proyección de la esfera */
  const ry = t * 0.35, rx = Math.sin(t * 0.16) * 0.35 + 0.25;
  const cosY = Math.cos(ry), sinY = Math.sin(ry), cosX = Math.cos(rx), sinX = Math.sin(rx);
  const P = nodos.map(n => {
    let x = n.x * cosY + n.z * sinY, z = -n.x * sinY + n.z * cosY;
    let y = n.y * cosX - z * sinX;  z = n.y * sinX + z * cosX;
    const esc = 2.6 / (2.6 + z) * respira;
    return { sx: cx + x * R * esc, sy: cy + y * R * esc, z, esc };
  });

  /* aristas (el grafo) */
  ctx.lineWidth = 0.6;
  for (const [i, j] of aristas){
    const a = P[i], b = P[j];
    const alfa = 0.05 + 0.10 * (1 - (a.z + b.z) / 2 - 0) * (0.5 + pulso * 0.5);
    ctx.strokeStyle = lat(0, Math.max(0.03, Math.min(0.22, alfa)));
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }

  /* nodos + nombres de archivo (etiqueta CENTRADA bajo su punto) */
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let i = 0; i < P.length; i++){
    const p = P[i], frente = (1 - p.z) / 2;          // 1 = de frente, 0 = detrás
    const rad = (1.1 + 1.6 * frente) * (1 + 0.35 * pulso * Math.sin(t * 6 + i));
    ctx.fillStyle = lat(0, 0.25 + 0.6 * frente);
    ctx.beginPath(); ctx.arc(p.sx, p.sy, rad, 0, 7); ctx.fill();
    const nombre = nodos[i].nombre;
    if (nombre && frente > 0.72 && i % 2 === 0){     // etiquetas solo al frente, sin saturar
      ctx.font = `${Math.round(9 * p.esc)}px Consolas,monospace`;
      ctx.fillStyle = lat(0, (frente - 0.72) * 2.2 * 0.75);
      ctx.fillText(nombre.slice(0, 34), p.sx, p.sy + rad + 3);
    }
  }

  /* ondas al hablar */
  if (estadoActual === "SPEAK" && Math.random() < dt * 3.2) ondas.push(0);
  ondas = ondas.filter(o => o < 1);
  for (let k = 0; k < ondas.length; k++){
    ondas[k] += dt * 0.7;
    ctx.strokeStyle = lat(0, 0.35 * (1 - ondas[k]));
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, R * (0.45 + ondas[k] * 0.75), 0, 7); ctx.stroke();
  }

  /* chispas hacia el núcleo al pensar */
  if (estadoActual === "THINK" && Math.random() < dt * 24 && P.length){
    const o = P[Math.floor(Math.random() * P.length)];
    chispas.push({ x: o.sx, y: o.sy, v: 0 });
  }
  chispas = chispas.filter(c => c.v < 1);
  for (const c of chispas){
    c.v += dt * 1.6;
    const x = c.x + (cx - c.x) * c.v, y = c.y + (cy - c.y) * c.v;
    ctx.fillStyle = lat(0, 0.8 * (1 - c.v));
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill();
  }

  const reloj = new Date().toLocaleTimeString("es-MX", { hour12: false });
  elMeta.textContent = `MEMORIA ${nodos.length} NODOS   ·   SESIONES ${activaciones}   ·   ${reloj}`;
  requestAnimationFrame(marco);
}
requestAnimationFrame(marco);
</script>
</body>
</html>
